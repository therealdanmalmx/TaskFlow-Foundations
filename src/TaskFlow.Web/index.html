<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      // Apply the saved appearance before the first paint.
      (() => {
        let theme = 'system'
        try { theme = localStorage.getItem('taskflow-theme') || 'system' } catch {}
        const explicit = theme === 'light' || theme === 'dark'
        const dark = theme === 'dark' || (!explicit && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1b2433' : '#f4f6fa'
      })()
    </script>
    <meta name="description" content="TaskFlow — a production-shaped team task board and deployment course fixture." />
    <title>TaskFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
